<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудиогид с подсветкой зон</title>
    <style>
        #map {
            width: 400px;
            <!-- height: 400px; -->
            display: block;
            position: relative;
        }
        #highlight {
            position: absolute;
            border: 2px solid yellow;
            background-color: rgba(255, 255, 0, 0.3);
            border-radius: 50%;
            pointer-events: none;
            display: none;
        }
        #controls {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #play-pause-btn {
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
        }
        #volume-slider {
            width: 100px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <img id="map" src="hall-map.jpg" alt="Карта зала изваяний" usemap="#sculpture-map">
    <map name="sculpture-map">
    <area target="" alt="" title="" href="" coords="197,272,10" shape="circle" data-audio="audio1.mp3" data-start-time="1" data-end-time="141">
    <area target="" alt="2" title="" href="" coords="208,142,10" shape="circle" data-audio="audio1.mp3" data-start-time="141" data-end-time="381">
    <area target="" alt="3" title="" href="" coords="175,143,10" shape="circle" data-audio="audio1.mp3" data-start-time="382" data-end-time="398">
    <area target="" alt="4" title="" href="" coords="182,173,10" shape="circle" data-audio="audio1.mp3" data-start-time="398" data-end-time="430">
    <area target="" alt="5" title="" href="" coords="220,173,10" shape="circle" data-audio="audio1.mp3" data-start-time="430" data-end-time="499">

    </map>

    <!-- Элемент для подсветки -->
    <div id="highlight"></div>

    <audio id="audio-player">
        <source src="audio1.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудиоэлемент.
    </audio>

    <!-- Кастомные элементы управления -->
    <div id="controls">
        <button id="play-pause-btn">⏯️</button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1">
    </div>

    <script>
        const audioPlayer = document.getElementById('audio-player');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const highlight = document.getElementById('highlight');

        // Обработка кликов по областям карты
        document.querySelectorAll('area').forEach(area => {
            area.addEventListener('click', (event) => {
                event.preventDefault();

                // Получаем время начала воспроизведения из атрибута data-start-time
                const startTime = parseFloat(area.getAttribute('data-start-time'));

                // Если аудио на паузе или не воспроизводится, сначала запускаем его
                if (audioPlayer.paused) {
                    audioPlayer.play().then(() => {
                        // Устанавливаем текущее время после начала воспроизведения
                        audioPlayer.currentTime = startTime;
                    }).catch(error => {
                        console.error("Ошибка воспроизведения аудио:", error);
                    });
                } else {
                    // Если аудио уже воспроизводится, просто перематываем
                    audioPlayer.currentTime = startTime;
                }
            });
        });

        // Отслеживание времени воспроизведения
        audioPlayer.addEventListener('timeupdate', () => {
            const currentTime = audioPlayer.currentTime;

            // Проверяем каждую зону
            document.querySelectorAll('area').forEach(area => {
                const startTime = parseFloat(area.getAttribute('data-start-time'));
                const endTime = parseFloat(area.getAttribute('data-end-time'));

                // Если текущее время попадает в диапазон зоны
                if (currentTime >= startTime && currentTime <= endTime) {
                    const coords = area.getAttribute('coords').split(',').map(Number);
                    highlight.style.left = `${coords[0] - coords[2]}px`;
                    highlight.style.top = `${coords[1] - coords[2]}px`;
                    highlight.style.width = `${coords[2] * 2}px`;
                    highlight.style.height = `${coords[2] * 2}px`;
                    highlight.style.display = 'block';
                } else {
                    highlight.style.display = 'none';
                }
            });
        });

        // Управление воспроизведением (кнопка паузы)
        playPauseBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playPauseBtn.textContent = "⏸️"; // Иконка паузы
            } else {
                audioPlayer.pause();
                playPauseBtn.textContent = "⏯️"; // Иконка воспроизведения
            }
        });

        // Управление громкостью (ползунок)
        volumeSlider.addEventListener('input', () => {
            audioPlayer.volume = volumeSlider.value;
        });

        // Обновление иконки кнопки при изменении состояния аудио
        audioPlayer.addEventListener('play', () => {
            playPauseBtn.textContent = "⏸️";
        });

        audioPlayer.addEventListener('pause', () => {
            playPauseBtn.textContent = "⏯️";
        });
    </script>
</body>
</html>
